name: Import photos and videos from Fleek

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "fleek-import/products.json"

permissions:
  contents: write

concurrency:
  group: import-fleek
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Import from Fleek
        run: node scripts/import-fleek.mjs
      - name: Check the site still builds
        run: node build.mjs
      - name: Save to the repo
        run: |
          git config user.name "ReUnion 31 import bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/images/uploads/fleek content/listings fleek-import
          if git diff --cached --quiet; then echo "Nothing new to import"; exit 0; fi
          git commit -m "Import photos and videos from Fleek store"
          git pull --rebase origin main
          git push origin main
